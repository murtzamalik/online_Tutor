server:
  port: 8090

spring:
  application:
    name: ai-gateway
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studyloop}
    username: ${SPRING_DATASOURCE_USERNAME:tutor_gateway_login}
    password: ${SPRING_DATASOURCE_PASSWORD:local_gateway_change_me}
  flyway:
    enabled: false

studyloop:
  gateway:
    service-token: ${GATEWAY_SERVICE_TOKEN:local_gateway_service_token_change_me}
    stub: ${AI_GATEWAY_STUB:true}
    prompts-path: ${PROMPTS_PATH:../../ai_prompts}
    embedding-url: ${EMBEDDING_SERVICE_URL:http://localhost:8100}
    # Per vendor HTTP call; core-api's gateway client waits 120s for the whole run (retry + fallback).
    vendor-timeout-seconds: ${AI_VENDOR_TIMEOUT_SECONDS:45}
    payload-purge-cron: "0 30 3 * * *"
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      model-override: ${ANTHROPIC_MODEL_OVERRIDE:}
      # Required when the API key is not workspace-scoped (Anthropic returns 400 otherwise).
      workspace-id: ${ANTHROPIC_WORKSPACE_ID:}
    litellm:
      base-url: ${LITELLM_BASE_URL:http://localhost:4000}
      api-key: ${LITELLM_MASTER_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
