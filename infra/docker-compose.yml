services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyloop}
      POSTGRES_USER: ${POSTGRES_USER:-studyloop_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_owner_change_me}
      TUTOR_APP_PASSWORD: ${TUTOR_APP_PASSWORD:-local_app_change_me}
      TUTOR_GATEWAY_PASSWORD: ${TUTOR_GATEWAY_PASSWORD:-local_gateway_change_me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studyloop_owner} -d ${POSTGRES_DB:-studyloop}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  core-api:
    build:
      context: .
      dockerfile: backend/core-api/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-studyloop}
      SPRING_DATASOURCE_USERNAME: tutor_app_login
      SPRING_DATASOURCE_PASSWORD: ${TUTOR_APP_PASSWORD:-local_app_change_me}
      FLYWAY_USER: ${POSTGRES_USER:-studyloop_owner}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-local_owner_change_me}
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt_secret_must_be_at_least_32_chars_long}
      AES_DATA_KEY: ${AES_DATA_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      REDIS_URL: redis://redis:6379
      AI_GATEWAY_BASE_URL: http://ai-gateway:8090
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-local_gateway_service_token_change_me}
      MARKING_ALLOW_LOCAL_STUB: ${MARKING_ALLOW_LOCAL_STUB:-true}
      OBJECT_STORAGE_LOCAL_ROOT: /data/past_papers/object_store
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_change_me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  ai-gateway:
    build:
      context: .
      dockerfile: backend/ai-gateway/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-studyloop}
      SPRING_DATASOURCE_USERNAME: tutor_gateway_login
      SPRING_DATASOURCE_PASSWORD: ${TUTOR_GATEWAY_PASSWORD:-local_gateway_change_me}
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-local_gateway_service_token_change_me}
      AI_GATEWAY_STUB: ${AI_GATEWAY_STUB:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL_OVERRIDE: ${ANTHROPIC_MODEL_OVERRIDE:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      EMBEDDING_SERVICE_URL: http://embedding-service:8100
      PROMPTS_PATH: /prompts
    volumes:
      - ./ai_prompts:/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy
      embedding-service:
        condition: service_started
      litellm:
        condition: service_healthy
    ports:
      - "8090:8090"

  embedding-service:
    build:
      context: ./embedding-service
    environment:
      EMBEDDING_STUB: ${EMBEDDING_STUB:-true}
    ports:
      - "8100:8100"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8080/api/v1
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8080/api/v1
      API_INTERNAL_BASE: http://core-api:8080/api/v1
    depends_on:
      - core-api
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - core-api
      - ai-gateway

volumes:
  pgdata:
  miniodata:
