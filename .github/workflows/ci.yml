name: ci

on:
  push:
    branches: [main, "w0/**", "feature/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Maven verify
        working-directory: backend
        run: mvn -B verify
      - name: Integration tests (Testcontainers)
        working-directory: backend
        continue-on-error: false
        run: mvn -B -Pintegration test
      - name: DB boundary/RLS gate (compose)
        run: |
          cp -n .env.example .env || true
          ./infra/scripts/verify_db_gate.sh
      - name: OpenAPI catalogue role-map gate
        run: python3 infra/scripts/check_catalogue_roles.py

  embedding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install & test
        working-directory: embedding-service
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install, lint, test, build
        working-directory: web
        run: |
          npm install
          npm test
          npm run build
