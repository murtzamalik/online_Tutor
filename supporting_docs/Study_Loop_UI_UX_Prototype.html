<title>Study Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700;800&family=Baloo+2:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — implements Design_System_Visual_Language.docx
   ============================================================ */
:root{
  /* brand */
  --navy:#1F3864; --navy-ink:#16294A; --teal:#1F7A63;
  /* neutrals (light) */
  --n900:#1A1A1A; --n700:#3A3F47; --n600:#555555; --n300:#C7CDD6; --n200:#E8E8E8; --n100:#EEF1F5; --n050:#F4F6F9;
  --surface:#FFFFFF; --ground:#EEF1F6;
  /* semantic answer */
  --correct:#2E8B57; --correct-bg:#E7F3EC; --partial:#B8860B; --partial-bg:#FBF2DE; --incorrect:#C0392B; --incorrect-bg:#FBEAE8;
  /* mastery scale */
  --m0:#D9D9D9; --m1:#F6C453; --m2:#8FBF6B; --m3:#1F7A63;
  /* tier accents */
  --t1:#F2994A; --t1-bg:#FDF2E3; --t1-rad:16px;
  --t2:#1F3864; --t2-bg:#E3EEFD; --t2-rad:10px;
  --t3:#3B4B66; --t3-bg:#E9E3F5; --t3-rad:6px;
  --t4:#555555; --t4-bg:#E8E8E8; --t4-rad:8px;
  /* chrome (artifact tool UI, theme-aware) */
  --chrome-bg:#F7F8FA; --chrome-panel:#FFFFFF; --chrome-border:#E3E7ED; --chrome-text:#16213A; --chrome-sub:#6B7686; --chrome-accent:#1F3864; --chrome-accent-ink:#FFFFFF; --chrome-stage:#E4E9F0;
  --shadow-sm:0 1px 2px rgba(20,30,50,.06), 0 1px 1px rgba(20,30,50,.04);
  --shadow-md:0 8px 24px rgba(20,30,50,.12);
  --ease:cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --chrome-bg:#0E1526; --chrome-panel:#151E33; --chrome-border:#26314A; --chrome-text:#EDF1F8; --chrome-sub:#93A0B8; --chrome-accent:#6C8FCE; --chrome-accent-ink:#0E1526; --chrome-stage:#0A0F1C;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --chrome-bg:#0E1526; --chrome-panel:#151E33; --chrome-border:#26314A; --chrome-text:#EDF1F8; --chrome-sub:#93A0B8; --chrome-accent:#6C8FCE; --chrome-accent-ink:#0E1526; --chrome-stage:#0A0F1C;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--chrome-bg); color:var(--chrome-text);
  font-family:"Inter",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{text-wrap:balance; margin:0;}
p{margin:0;}
img{max-width:100%;}
button{font-family:inherit;}

/* ============================================================
   NAVIGATOR CHROME
   ============================================================ */
.app{display:flex; min-height:100vh; padding:16px; gap:16px;}
.nav{
  width:288px; flex:0 0 288px; background:var(--chrome-panel); border:1px solid var(--chrome-border);
  border-radius:14px; padding:18px 14px; display:flex; flex-direction:column; gap:4px;
  height:calc(100vh - 32px); position:sticky; top:16px; overflow-y:auto;
}
.nav-brand{display:flex; align-items:center; gap:10px; padding:2px 8px 16px; border-bottom:1px solid var(--chrome-border); margin-bottom:10px;}
.nav-brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--navy),var(--teal));flex:none;}
.nav-brand .word{font-weight:800; font-size:15px; letter-spacing:-.01em;}
.nav-brand .sub{font-size:11px; color:var(--chrome-sub); margin-top:1px;}
.nav-section{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--chrome-sub); padding:14px 8px 6px;}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 8px; border-radius:8px;
  border:none; background:transparent; color:var(--chrome-text); cursor:pointer; font-size:13.5px; line-height:1.3;
  transition:background .12s var(--ease);
}
.nav-item:hover{background:var(--chrome-border);}
.nav-item.active{background:var(--chrome-accent); color:var(--chrome-accent-ink); font-weight:600;}
.nav-item .id{font-size:10px; font-variant-numeric:tabular-nums; opacity:.7; font-weight:700; flex:none; width:34px;}
.nav-item .tier-dot{width:7px;height:7px;border-radius:50%;flex:none;}
.nav-foot{margin-top:auto; padding:12px 8px 2px; border-top:1px solid var(--chrome-border); font-size:11px; color:var(--chrome-sub); line-height:1.5;}

.stage-col{flex:1; min-width:0; display:flex; flex-direction:column; gap:12px;}
.stage-toolbar{
  background:var(--chrome-panel); border:1px solid var(--chrome-border); border-radius:12px; padding:12px 18px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.stage-toolbar .crumb{font-size:13px; color:var(--chrome-sub);}
.stage-toolbar .crumb b{color:var(--chrome-text); font-weight:600;}
.chip{font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; letter-spacing:.02em;}
.chip.tier1{background:var(--t1-bg); color:#8a4a12;}
.chip.tier2{background:var(--t2-bg); color:var(--navy);}
.chip.tier3{background:var(--t3-bg); color:#4a3a70;}
.chip.tier4{background:var(--t4-bg); color:#333;}
.chip.plat{background:var(--chrome-border); color:var(--chrome-text);}
.chip.pr-must{background:#FBEAE8; color:#9a2f21;}
.chip.pr-should{background:#FBF2DE; color:#8a6c14;}
.chip.pr-could{background:#E3EEFD; color:#1F3864;}
.chip.pr-wont{background:var(--n200); color:var(--n600);}
.stage-toolbar .spacer{flex:1;}
.stage-note{font-size:12px; color:var(--chrome-sub); max-width:360px; text-align:right;}

.stage{
  flex:1; background:var(--chrome-stage); border:1px solid var(--chrome-border); border-radius:16px;
  display:flex; align-items:flex-start; justify-content:center; padding:36px 24px; overflow:auto;
}
.device-frame{background:#fff; overflow:hidden; flex:none;}
.device-frame.web{
  width:min(1240px,100%); border-radius:12px; box-shadow:var(--shadow-md); border:1px solid #D8DEE8;
}
.device-frame.web .browser-bar{
  height:38px; background:#EDEFF3; border-bottom:1px solid #DBDFE7; display:flex; align-items:center; gap:7px; padding:0 14px;
}
.device-frame.web .browser-bar .dot{width:9px;height:9px;border-radius:50%;}
.device-frame.web .browser-bar .dot:nth-child(1){background:#EE6A5F;}
.device-frame.web .browser-bar .dot:nth-child(2){background:#F5BD4F;}
.device-frame.web .browser-bar .dot:nth-child(3){background:#61C454;}
.device-frame.web .browser-bar .url{margin-left:10px; background:#fff; border:1px solid #DBDFE7; border-radius:6px; font-size:11px; color:#7a8290; padding:4px 10px; flex:1; max-width:420px; font-family:monospace;}
.device-frame.mobile{
  width:390px; border-radius:44px; border:10px solid #111; box-shadow:var(--shadow-md); position:relative;
}
.device-frame.mobile::before{content:"";position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:26px; background:#111; border-radius:0 0 16px 16px; z-index:5;}
.device-content{width:100%; overflow:auto; max-height:82vh;}
.device-frame.mobile .device-content{height:844px; max-height:844px;}
.device-frame.web .device-content{min-height:200px;}

@media (max-width: 900px){
  .app{flex-direction:column;}
  .nav{width:100%; flex:none; height:auto; position:relative; top:0;}
  .stage{padding:20px 10px;}
}

/* ============================================================
   SHARED PRODUCT COMPONENTS (used inside device frames)
   ============================================================ */
.tier1, .tier2, .tier3, .tier4{ font-family:"Inter",system-ui,sans-serif; color:var(--n900); background:var(--surface); }
.tier1{ --accent:var(--t1); --accent-bg:var(--t1-bg); --radius:var(--t1-rad); --heading-font:"Baloo 2",system-ui,sans-serif; }
.tier2{ --accent:var(--t2); --accent-bg:var(--t2-bg); --radius:var(--t2-rad); --heading-font:"Inter",system-ui,sans-serif; }
.tier3{ --accent:var(--t3); --accent-bg:var(--t3-bg); --radius:var(--t3-rad); --heading-font:"Inter",system-ui,sans-serif; }
.tier4{ --accent:var(--t4); --accent-bg:var(--t4-bg); --radius:var(--t4-rad); --heading-font:"Inter",system-ui,sans-serif; }

.ph{ padding:22px 28px; }
.ph.tight{ padding:16px 18px; }
.p-h1{ font-family:var(--heading-font); font-weight:700; font-size:22px; letter-spacing:-.01em; }
.p-h2{ font-family:var(--heading-font); font-weight:700; font-size:16.5px; }
.p-sub{ color:var(--n600); font-size:13px; }
.p-topbar{
  display:flex; align-items:center; gap:16px; padding:14px 28px; border-bottom:1px solid var(--n200);
}
.p-topbar .brand{display:flex; align-items:center; gap:9px; font-weight:800; font-family:var(--heading-font); color:var(--accent);}
.p-topbar .brand .dot{width:22px;height:22px;border-radius:7px;background:var(--accent);}
.p-topbar nav{display:flex; gap:22px; font-size:13.5px; font-weight:600; color:var(--n600); margin-left:12px;}
.p-topbar nav a{color:inherit; text-decoration:none; cursor:default;}
.p-topbar nav a.on{color:var(--accent);}
.p-topbar .sp{flex:1;}
.p-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-bg); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:8px; border:none; cursor:pointer;
  font-weight:600; font-size:13.5px; padding:10px 18px; transition:transform .12s var(--ease), box-shadow .12s var(--ease), background .12s var(--ease);
}
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--accent); color:#fff; box-shadow:var(--shadow-sm); }
.btn-primary:hover{ box-shadow:var(--shadow-md); }
.btn-outline{ background:transparent; color:var(--accent); border:1.5px solid var(--accent); }
.btn-text{ background:transparent; color:var(--accent); padding:8px 4px; }
.btn-sm{ padding:7px 13px; font-size:12.5px; }

.card{ background:#fff; border:1px solid var(--n200); border-radius:var(--radius); }
.card.pad{ padding:18px 20px; }
.card:hover{ box-shadow:var(--shadow-sm); }

.pill{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:99px; }
.pill-must{ background:var(--incorrect-bg); color:#9a2f21; }
.pill-teal{ background:#E1F1EC; color:var(--teal); }

/* mastery ring */
.mring{ position:relative; width:56px; height:56px; flex:none; }
.mring svg{ transform:rotate(-90deg); }
.mring circle{ fill:none; stroke-width:6; }
.mring .track{ stroke:var(--n200); }
.mring .fill{ stroke-linecap:round; transition:stroke-dashoffset 1s var(--ease); }
.mring .pct{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; }

/* question card */
.qcard{ max-width:640px; margin:0 auto; }
.qmeta{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--n600); margin-bottom:14px; }
.qmeta .sep{opacity:.5;}
.qstem{ font-size:17px; line-height:1.55; margin-bottom:18px; }
.qopt{
  display:flex; align-items:center; gap:12px; padding:13px 16px; border:1.5px solid var(--n200); border-radius:var(--radius);
  margin-bottom:10px; cursor:pointer; font-size:14px; transition:border-color .12s var(--ease), background .12s var(--ease);
}
.qopt:hover{ border-color:var(--accent); }
.qopt .letter{ width:24px;height:24px;border-radius:50%;border:1.5px solid var(--n300); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none; color:var(--n600);}
.qopt.sel{ border-color:var(--accent); background:var(--accent-bg); }
.qopt.sel .letter{ background:var(--accent); border-color:var(--accent); color:#fff; }
.qopt.correct{ border-color:var(--correct); background:var(--correct-bg); }
.qopt.correct .letter{ background:var(--correct); border-color:var(--correct); color:#fff; }
.qactions{ display:flex; justify-content:flex-end; margin-top:18px; }
.feedback{ margin-top:18px; border-radius:var(--radius); padding:16px 18px; display:flex; gap:12px; }
.feedback.ok{ background:var(--correct-bg); border:1px solid #bfe0cd; }
.feedback.warn{ background:var(--partial-bg); border:1px solid #ecd9a4; }
.feedback .ic{ width:26px;height:26px;border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:14px; }
.feedback.ok .ic{ background:var(--correct); }
.feedback.warn .ic{ background:var(--partial); }
.feedback h4{ font-size:14px; margin-bottom:3px; }
.feedback p{ font-size:13px; line-height:1.5; color:var(--n700); }

/* voice tutor */
.vt-persona{ width:120px; height:120px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #2c8f74, var(--teal)); position:relative; display:flex; align-items:center; justify-content:center; margin:0 auto; }
.vt-persona .ring{ position:absolute; inset:-10px; border-radius:50%; border:2px solid var(--teal); opacity:0; }
.vt-persona.listening .ring{ animation:vtpulse 1.6s var(--ease) infinite; }
.vt-persona.speaking .face{ animation:vtspeak 1s ease-in-out infinite; }
.vt-persona .face{ width:44px; height:26px; }
@keyframes vtpulse{ 0%{ transform:scale(.9); opacity:.7;} 100%{ transform:scale(1.35); opacity:0;} }
@keyframes vtspeak{ 0%,100%{ transform:scaleY(1);} 50%{ transform:scaleY(1.3);} }
.vt-dots span{ width:6px;height:6px;border-radius:50%;background:#fff; display:inline-block; margin:0 2px; opacity:.5; animation:vtdot 1.1s infinite; }
.vt-dots span:nth-child(2){animation-delay:.15s;} .vt-dots span:nth-child(3){animation-delay:.3s;}
@keyframes vtdot{ 0%,60%,100%{opacity:.35; transform:translateY(0);} 30%{opacity:1; transform:translateY(-3px);} }
.vt-bubble{ background:var(--n050); border-radius:14px; padding:12px 15px; font-size:13.5px; line-height:1.5; max-width:420px; }
.vt-bubble.me{ background:var(--accent); color:#fff; margin-left:auto; }
.vt-state-btn{ border:1px solid var(--n300); background:#fff; border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer; font-weight:600; }
.vt-state-btn.active{ background:var(--teal); color:#fff; border-color:var(--teal); }

/* mobile bottom tabs */
.m-tabs{ position:sticky; bottom:0; background:#fff; border-top:1px solid var(--n200); display:flex; }
.m-tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 12px; font-size:10.5px; font-weight:600; color:var(--n600); }
.m-tab.on{ color:var(--accent); }
.m-tab .dot-ic{ width:20px;height:20px;border-radius:6px;background:var(--n200); }
.m-tab.on .dot-ic{ background:var(--accent); }
.m-fab{ position:absolute; right:16px; bottom:78px; width:52px;height:52px;border-radius:50%; background:var(--teal); box-shadow:var(--shadow-md); display:flex; align-items:center; justify-content:center; }

/* tables (admin/teacher) */
table.dtable{ width:100%; border-collapse:collapse; font-size:13px; }
table.dtable th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--n600); padding:9px 14px; border-bottom:1px solid var(--n200); }
table.dtable td{ padding:11px 14px; border-bottom:1px solid var(--n100); }
table.dtable tr:last-child td{ border-bottom:none; }
.status-dot{ width:8px;height:8px;border-radius:50%; display:inline-block; margin-right:6px; }

.skeleton{ background:linear-gradient(90deg,var(--n100) 25%,var(--n200) 37%,var(--n100) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:8px; }
@keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
.device-content.dys, .device-content.dys *{ font-family:"Atkinson Hyperlegible",sans-serif !important; line-height:1.75 !important; letter-spacing:.01em !important; }

/* research-informed additions: streak/XP, AI reasoning trail, bulk actions, calendar, flashcards */
.streak{ display:flex; align-items:center; gap:7px; background:#FFF4E8; border:1px solid #FCE0BE; border-radius:99px; padding:5px 12px 5px 8px; }
.flame{ width:16px;height:18px; position:relative; }
.flame::before{ content:""; position:absolute; inset:0; background:linear-gradient(180deg,#FFB238,#F2711C); clip-path:path('M8 0C8 5 3 6 3 11a5 5 0 0 0 10 0c0-2-1-3-2-4 0 2-1 3-2 3-1.5 0-1-3-1-5C8 3 8 1 8 0Z'); animation:flick 1.8s ease-in-out infinite; }
@keyframes flick{ 0%,100%{ transform:scaleY(1) rotate(0deg);} 50%{ transform:scaleY(1.08) rotate(-2deg);} }
.xp-bar{ height:8px; border-radius:99px; background:var(--n200); overflow:hidden; }
.xp-bar > div{ height:100%; border-radius:99px; background:linear-gradient(90deg,#F6C453,#F2994A); transition:width 1s var(--ease); }
.badge{ width:52px;height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:22px; }
.reasoning{ border:1px dashed var(--n300); border-radius:10px; overflow:hidden; margin-top:10px; }
.reasoning summary{ cursor:pointer; padding:9px 12px; font-size:12.5px; font-weight:600; color:var(--teal); list-style:none; display:flex; align-items:center; gap:6px; }
.reasoning summary::-webkit-details-marker{ display:none; }
.reasoning summary::before{ content:"▸"; transition:transform .15s; }
.reasoning[open] summary::before{ transform:rotate(90deg); }
.reasoning .body{ padding:0 14px 12px; font-size:12.5px; color:var(--n700); line-height:1.6; }
.bulkbar{ display:flex; align-items:center; gap:10px; background:var(--navy); color:#fff; border-radius:10px; padding:9px 14px; font-size:12.5px; margin-bottom:10px; }
.bulkbar .sp{flex:1;}
.perm-chip{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:6px; background:var(--n100); color:var(--n700); }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-cell{ aspect-ratio:1; border-radius:8px; background:var(--n050); display:flex; align-items:center; justify-content:center; font-size:11.5px; color:var(--n600); position:relative; }
.cal-cell.exam{ background:var(--incorrect-bg); color:var(--incorrect); font-weight:800; }
.cal-cell.today{ border:1.5px solid var(--accent); font-weight:800; color:var(--accent); }
.flashcard{ width:100%; max-width:340px; height:200px; margin:0 auto; perspective:1000px; }
.flashcard-inner{ position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; cursor:pointer; }
.flashcard.flipped .flashcard-inner{ transform:rotateY(180deg); }
.flashcard-face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:16px; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; font-size:16px; font-weight:600; box-shadow:var(--shadow-sm); }
.flashcard-face.front{ background:#fff; border:1.5px solid var(--n200); }
.flashcard-face.back{ background:var(--accent); color:#fff; transform:rotateY(180deg); }
.chip-toggle{ display:inline-flex; align-items:center; gap:7px; border:1px solid var(--n300); border-radius:99px; padding:6px 12px; font-size:12px; cursor:pointer; background:#fff; }
.chip-toggle.on{ background:var(--accent-bg); border-color:var(--accent); color:var(--accent); font-weight:700; }
.sw{ position:relative; width:38px; height:21px; display:inline-block; flex:none; }
.sw input{ opacity:0; width:0; height:0; }
.sw .track{ position:absolute; inset:0; background:var(--n300); border-radius:99px; transition:background .15s; }
.sw .knob{ position:absolute; top:3px; left:3px; width:15px; height:15px; background:#fff; border-radius:50%; transition:left .15s; }
.sw input:checked + .track{ background:var(--teal); }
.sw input:checked ~ .knob{ left:20px; }
</style>
<div class="app">
  <aside class="nav">
    <div class="nav-brand">
      <div class="mark"></div>
      <div>
        <div class="word">Study Loop</div>
        <div class="sub">Screen prototype · all 94 screens</div>
      </div>
    </div>
    <div id="navList"></div>
    <div class="nav-foot">All 94 screens from Screen_Inventory.xlsx, built to Design_System_Visual_Language.docx. Research-informed: role-based dashboards, visible AI reasoning, streaks reserved for later.</div>
  </aside>
  <div class="stage-col">
    <div class="stage-toolbar" id="toolbar"></div>
    <div class="stage" id="stage">
      <div class="device-frame" id="deviceFrame">
        <div class="browser-bar" id="browserBar">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="url" id="urlBar">studyloop.app</span>
        </div>
        <div class="device-content" id="stageContent"></div>
      </div>
    </div>
  </div>
</div>

const TIER_LABEL = {1:"Tier 1 · Foundation (11+)",2:"Tier 2 · Core (GCSE/iGCSE)",3:"Tier 3 · Advanced (A-Level)",4:"Tier 4 · Professional"};
const PR_LABEL = {must:"Must",should:"Should",could:"Could",wont:"Won't (yet)"};

const navList = document.getElementById("navList");
const toolbar = document.getElementById("toolbar");
const stage = document.getElementById("stage");
const deviceFrame = document.getElementById("deviceFrame");
const stageContent = document.getElementById("stageContent");
const browserBar = document.getElementById("browserBar");
const urlBar = document.getElementById("urlBar");

let flat = [];
SECTIONS.forEach(sec=>{
  const h = document.createElement("div");
  h.className = "nav-section"; h.textContent = sec.name;
  navList.appendChild(h);
  sec.screens.forEach(s=>{
    const b = document.createElement("button");
    b.className = "nav-item"; b.dataset.tpl = s.tpl;
    b.innerHTML = `<span class="id">${s.code}</span><span class="tier-dot" style="background:var(--t${s.tier})"></span><span>${s.name}</span>`;
    b.onclick = ()=>select(s);
    navList.appendChild(b);
    flat.push({el:b, s});
  });
});

function select(s){
  flat.forEach(f=>f.el.classList.toggle("active", f.s===s));
  const tpl = document.getElementById("tpl-"+s.tpl);
  stageContent.innerHTML = "";
  stageContent.appendChild(tpl.content.cloneNode(true));
  stageContent.classList.remove("dys");

  const isMobile = s.plat === "mobile";
  deviceFrame.className = "device-frame " + (isMobile ? "mobile" : "web");
  browserBar.style.display = isMobile ? "none" : "flex";
  if(!isMobile) urlBar.textContent = s.url;

  toolbar.innerHTML = `
    <span class="crumb"><b>${s.code}</b> · ${s.name}</span>
    <span class="chip tier${s.tier}">${TIER_LABEL[s.tier]}</span>
    <span class="chip plat">${isMobile ? "Mobile · iOS / Android" : "Web"}</span>
    <span class="chip pr-${s.pr}">${PR_LABEL[s.pr]}</span>
    <span class="spacer"></span>
    <span class="stage-note">${s.note ? "⚑ " + s.note : ""}</span>
  `;
}

function setVtState(state){
  const persona = document.getElementById("vtPersona");
  const label = document.getElementById("vtStateLabel");
  const sub = document.getElementById("vtStateSub");
  if(!persona) return;
  persona.className = "vt-persona " + state;
  document.querySelectorAll(".vt-state-btn").forEach(btn=>{
    btn.classList.toggle("active", btn.textContent.toLowerCase() === state);
  });
  const copy = {
    listening:["Listening…","Go ahead — ask about the question."],
    thinking:["Thinking…","Working through your question with the mark scheme."],
    speaking:["Speaking…","Live captions shown below as it talks."],
  };
  label.textContent = copy[state][0];
  sub.textContent = copy[state][1];
}

function toggleDyslexia(){
  const on = document.getElementById("dysToggle").checked;
  stageContent.classList.toggle("dys", on);
  document.getElementById("dysTrack").style.background = on ? "var(--teal)" : "var(--n300)";
  document.getElementById("dysKnob").style.left = on ? "21px" : "3px";
}

select(SECTIONS[0].screens[0]);
